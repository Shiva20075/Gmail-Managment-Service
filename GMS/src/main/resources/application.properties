spring.application.name=demo
server.port=8081
spring.main.allow-circular-references=true

# MySQL
spring.datasource.url=jdbc:mysql://gms-mysql.cd2ao4kwoj6p.ap-southeast-2.rds.amazonaws.com:3306/gms_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.modify,https://www.googleapis.com/auth/gmail.send
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Claude API
claude.api-key=${ANTHROPIC_API_KEY}
claude.system-prompt=${CLAUDE_SYSTEM_PROMPT}
claude.user-prompt=${CLAUDE_USER_PROMPT}